stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - src/data/data_ingestion.py
    params:
    - data_ingestion.test_size
    - data_ingestion.random_state
    outs:
    - data/raw

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw/train.csv
    - data/raw/test.csv
    - src/data/data_preprocessing.py
    outs:
    - data/interim  
  model_comparison:
    cmd: python -m src.training.compare --models naive_bayes logistic_regression linear_svm lightgbm mlp --random-state ${data_ingestion.random_state}
    deps:
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    - src/models/traditional.py
    - src/models/mlp.py
    - src/training/evaluation.py
    - src/training/train.py
    - src/training/compare.py
    params:
    - data_ingestion.random_state
    - model_building.max_features
    - model_building.ngram_range
    - mlp.max_features
    - mlp.hidden_size
    - mlp.dropout
    - mlp.epochs
    - mlp.batch_size
    - mlp.learning_rate
    outs:
    - reports/model_comparison.csv
    - reports/model_comparison.json
    - reports/figures
