[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "yt_comment"
version = "0.0.1"
description = "YouTube comment sentiment analysis pipeline with MLflow, DVC, and Flask serving"
authors = [
  { name = "Archit Sharma" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["src", "flask_app", "tests"]
include = ["pyproject.toml", "project_utils.py", "src/**/*.py", "flask_app/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["yt_comment"]
force-sort-within-sections = true

